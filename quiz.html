<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CODE QUIZ PLAYER - SECURITY & READABILITY</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <!-- PrismJS: Okaidia 테마 (코드가 가장 잘 보임) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-css.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-markup.min.js"></script> <!-- HTML/XML 지원 -->

    <style>
        @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');

        :root {
            --bg: #ececf1; --card: #ffffff; --text: #111111;
            --primary: #FB5424; --border: #000000;
        }

        [data-theme="dark"] {
            --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --border: #30363d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Galmuri9', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; line-height: 1.6; }

        .pixel-card {
            background: var(--card);
            border: 4px solid var(--border);
            box-shadow: 12px 12px 0 rgba(0,0,0,0.15);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            position: relative;
        }

        .hp-bar { width: 100%; height: 28px; border: 4px solid var(--border); background: #333; margin-bottom: 25px; }
        .hp-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.5s ease; }

        /* --- 가독성 및 코드 블록 설정 --- */
        .q-text {
            font-size: 1.2rem; margin-bottom: 40px; padding: 25px;
            background: rgba(0,0,0,0.03); border-left: 8px solid var(--primary);
        }

        /* 코드 블록은 무조건 독립된 영역으로 */
        pre {
            display: block !important;
            background: #272822 !important;
            padding: 20px !important;
            margin: 20px 0 !important;
            border: 2px solid var(--border);
            overflow-x: auto;
            border-radius: 5px;
        }

        code { font-family: 'Consolas', 'Monaco', monospace !important; font-size: 0.95rem !important; }

        /* 인라인 코드 강조 */
        :not(pre) > code {
            background: var(--primary) !important;
            color: #fff !important;
            padding: 2px 6px !important;
            border-radius: 3px;
        }

        p { margin-bottom: 15px; }

        .opt-list { display: grid; gap: 15px; }
        .opt-btn {
            background: var(--card); border: 3px solid var(--border); padding: 20px;
            color: var(--text); cursor: pointer; text-align: left; font-size: 1.1rem;
            box-shadow: 6px 6px 0 var(--border); transition: 0.1s;
        }
        .opt-btn:hover { background: var(--primary); color: white; transform: translate(-3px, -3px); box-shadow: 9px 9px 0 var(--border); }
        .opt-btn:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--border); }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-content { background: var(--card); border: 4px solid var(--border); width: 100%; max-width: 600px; padding: 40px; text-align: center; box-shadow: 15px 15px 0 var(--primary); }
        .m-title { font-size: 3rem; font-weight: bold; margin-bottom: 20px; }
        .m-exp { text-align: left; font-size: 1rem; margin-bottom: 30px; padding: 15px; background: var(--bg); border: 2px dashed var(--border); }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div class="container">
        <div id="screen-start" class="pixel-card">
            <h1 id="quiz-title" style="color:var(--primary); text-align:center;">QUEST LOADING...</h1>
            <button class="opt-btn" style="width:100%; text-align:center; margin-top:30px;" onclick="startQuiz()">MISSION START</button>
        </div>

        <div id="screen-quiz" class="pixel-card hidden">
            <div class="hp-bar"><div id="hp-fill" class="hp-fill"></div></div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; font-weight: bold;">
                <span id="stage-info" style="color: var(--primary);">STAGE 01</span>
                <span id="count-info">1 / 5</span>
            </div>
            <div id="q-text" class="q-text"></div>
            <div id="opt-list" class="opt-list"></div>
        </div>

        <div id="screen-result" class="pixel-card hidden" style="text-align: center;">
            <h1>MISSION COMPLETE</h1>
            <div id="final-score" style="font-size: 5rem; color: var(--primary); margin: 30px 0;">0 / 0</div>
            <button class="opt-btn" style="width: 100%; text-align:center;" onclick="location.reload()">REPLAY QUEST</button>
        </div>
    </div>

    <div id="modal" class="modal">
        <div class="modal-content">
            <div id="m-title" class="m-title">CORRECT</div>
            <div id="m-exp" class="m-exp"></div>
            <button class="opt-btn" style="width:100%; text-align:center; background:var(--primary); color:white;" onclick="nextStage()">NEXT STAGE</button>
        </div>
    </div>

    <script>
        // --- 핵심: 안전한 마크다운 변환 함수 ---
        function getSafeMarkdown(rawText) {
            if (!rawText) return "";
            // 1. 모든 < 와 > 를 엔티티로 변환하여 브라우저가 실행하지 못하게 함
            let safeText = rawText.replace(/</g, "&lt;").replace(/>/g, "&gt;");
            
            // 2. marked.js를 통해 마크다운 변환
            return marked.parse(safeText);
        }

        marked.setOptions({ breaks: true, gfm: true });

        const SB_URL = "https://eixxtdnkqopqiawqvibl.supabase.co";
        const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeHh0ZG5rcW9wcWlhd3F2aWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTQ5MjYsImV4cCI6MjEwMjM3MDkyNn0.R7--WSmlJnYuz2bymCUhzzpTKVY-OHNIhyAR7e-qMYE";
        let db, questions = [], curIdx = 0, score = 0;

        window.onload = async () => {
            db = window.supabase.createClient(SB_URL, SB_KEY);
            const id = new URLSearchParams(window.location.search).get('id');
            if(!id) return;
            const { data } = await db.from('quizzes').select('*').eq('id', id).single();
            questions = data.quiz_data;
            document.getElementById('quiz-title').innerText = data.title;
        };

        function startQuiz() {
            document.getElementById('screen-start').classList.add('hidden');
            document.getElementById('screen-quiz').classList.remove('hidden');
            renderStage();
        }

        function renderStage() {
            const q = questions[curIdx];
            document.getElementById('hp-fill').style.width = ((curIdx / questions.length) * 100) + "%";
            document.getElementById('stage-info').innerText = "STAGE " + String(curIdx + 1).padStart(2, '0');
            document.getElementById('count-info').innerText = (curIdx + 1) + " / " + questions.length;

            // 안전한 렌더링 적용
            document.getElementById('q-text').innerHTML = getSafeMarkdown(q.q);

            const optList = document.getElementById('opt-list');
            optList.innerHTML = "";
            q.a.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'opt-btn';
                btn.innerHTML = getSafeMarkdown(opt.text);
                btn.onclick = () => checkAnswer(i);
                optList.appendChild(btn);
            });

            Prism.highlightAll();
        }

        function checkAnswer(idx) {
            const q = questions[curIdx];
            const isCorrect = (idx === q.cor);
            if(isCorrect) score++;

            const modal = document.getElementById('modal');
            document.getElementById('m-title').innerText = isCorrect ? "CORRECT" : "WRONG";
            document.getElementById('m-title').style.color = isCorrect ? "#2ecc71" : "#e74c3c";
            
            // 해설에도 안전한 렌더링 적용
            document.getElementById('m-exp').innerHTML = getSafeMarkdown(q.a[idx].exp);
            
            modal.style.display = "flex";
            Prism.highlightAll();
        }

        function nextStage() {
            document.getElementById('modal').style.display = "none";
            curIdx++;
            if(curIdx < questions.length) renderStage();
            else showResult();
        }

        function showResult() {
            document.getElementById('screen-quiz').classList.add('hidden');
            document.getElementById('screen-result').classList.remove('hidden');
            document.getElementById('final-score').innerText = score + " / " + questions.length;
        }
    </script>
</body>
</html>
