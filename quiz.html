<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PIXEL QUIZ PLAYER PRO</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');
        :root { --bg: #f0f0f0; --card: #ffffff; --text: #000; --primary: #FB5424; --border: #000; --shadow: #bcbcbc; --correct: #2ecc71; --wrong: #e74c3c; }
        [data-theme="dark"] { --bg: #1a1a1a; --card: #2d2d2d; --text: #fff; --border: #fff; --shadow: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Galmuri9', sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; transition: 0.3s; }
        .pixel-card { background: var(--card); border: 4px solid var(--border); box-shadow: 10px 10px 0 var(--shadow); padding: 30px; width: 100%; max-width: 650px; position: relative; }
        .hp-bar { width: 100%; height: 25px; border: 4px solid var(--border); background: #333; margin-bottom: 25px; overflow: hidden; }
        .hp-fill { height: 100%; background: var(--primary); width: 0%; transition: width 0.4s steps(10); }
        h1 { text-align: center; color: var(--primary); text-shadow: 2px 2px 0 var(--border); margin-bottom: 20px; }
        .q-text { font-size: 1.15rem; line-height: 1.6; margin-bottom: 30px; border-bottom: 2px dashed var(--border); padding-bottom: 20px; }
        .opt-btn { width: 100%; background: var(--card); border: 3px solid var(--border); padding: 18px; color: var(--text); cursor: pointer; text-align: left; margin-bottom: 12px; box-shadow: 5px 5px 0 var(--border); font-size: 1rem; transition: 0.1s; }
        .opt-btn:hover { background: var(--primary); color: white; transform: translate(-2px, -2px); box-shadow: 7px 7px 0 var(--border); }
        .opt-btn:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--border); }
        pre { background: #272822 !important; padding: 15px; overflow-x: auto; border: 2px solid var(--border); margin: 15px 0; }
        code { font-family: monospace !important; }
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; display: none; }
        .modal-content { background: var(--card); border: 4px solid var(--border); padding: 35px; max-width: 550px; width: 90%; text-align: center; box-shadow: 15px 15px 0 var(--primary); }
        .hidden { display: none !important; }
        .score-big { font-size: 5rem; color: var(--primary); margin: 20px 0; text-shadow: 4px 4px 0 var(--border); }
    </style>
</head>
<body>

<div class="pixel-card" id="screen-start">
    <div style="text-align:center; font-size: 0.8rem; margin-bottom: 10px; color: var(--primary);">[ MISSION INCOMING ]</div>
    <h1 id="main-title">LOADING DATA...</h1>
    <div style="height: 4px; background: var(--border); margin: 20px 0;"></div>
    <p style="text-align:center; margin-bottom: 30px; line-height: 1.8;">모든 준비가 완료되었습니다.<br>당신의 지식을 증명하십시오.</p>
    <button class="opt-btn" style="text-align:center; font-size: 1.3rem;" onclick="start()">START CHALLENGE</button>
</div>

<div class="pixel-card hidden" id="screen-quiz">
    <div class="hp-bar"><div id="hp-fill" class="hp-fill"></div></div>
    <div style="display:flex; justify-content:space-between; margin-bottom:15px; font-weight:bold;">
        <span id="stage-label" style="color:var(--primary);">STAGE 01</span>
        <span id="progress-label">1 / 5</span>
    </div>
    <div id="q-text" class="q-text"></div>
    <div id="opt-container"></div>
</div>

<div class="modal" id="modal">
    <div class="modal-content">
        <h2 id="m-result" style="font-size: 2.5rem; margin-bottom: 20px;"></h2>
        <div id="m-exp" style="text-align: left; margin-bottom: 30px; line-height: 1.6; border: 2px solid var(--border); padding: 15px; background: var(--bg);"></div>
        <button class="opt-btn" style="background: var(--primary); color: white; text-align: center;" onclick="next()">NEXT STAGE (PRESS ENTER)</button>
    </div>
</div>

<div class="pixel-card hidden" id="screen-result" style="text-align:center;">
    <h1 style="font-size: 2rem;">MISSION CLEAR</h1>
    <div class="score-big" id="final-score">0 / 0</div>
    <p id="result-msg" style="margin-bottom: 30px; font-size: 1.1rem;"></p>
    <button class="opt-btn" style="text-align:center;" onclick="location.reload()">TRY AGAIN</button>
</div>

<script>
    const SB_URL = "https://eixxtdnkqopqiawqvibl.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeHh0ZG5rcW9wcWlhd3F2aWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTQ5MjYsImV4cCI6MjEwMjM3MDkyNn0.R7--WSmlJnYuz2bymCUhzzpTKVY-OHNIhyAR7e-qMYE";
    let db, questions = [], cur = 0, score = 0;

    window.onload = async () => {
        db = window.supabase.createClient(SB_URL, SB_KEY);
        const id = new URLSearchParams(window.location.search).get('id');
        if(!id) return document.getElementById('main-title').innerText = "NO QUIZ ID FOUND";
        
        const { data, error } = await db.from('quizzes').select('*').eq('id', id).single();
        if(error) return document.getElementById('main-title').innerText = "ERROR LOADING DATA";
        
        questions = data.quiz_data;
        document.getElementById('main-title').innerText = data.title;
    };

    function start() {
        document.getElementById('screen-start').classList.add('hidden');
        document.getElementById('screen-quiz').classList.remove('hidden');
        render();
    }

    function render() {
        const q = questions[cur];
        document.getElementById('hp-fill').style.width = ((cur / questions.length) * 100) + "%";
        document.getElementById('stage-label').innerText = "STAGE " + String(cur + 1).padStart(2, '0');
        document.getElementById('progress-label').innerText = (cur + 1) + " / " + questions.length;
        
        document.getElementById('q-text').innerHTML = marked.parse(q.q);
        
        const container = document.getElementById('opt-container');
        container.innerHTML = "";
        q.a.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'opt-btn';
            btn.innerHTML = marked.parse(opt.text);
            btn.onclick = () => check(i);
            container.appendChild(btn);
        });
        Prism.highlightAll();
    }

    function check(idx) {
        const q = questions[cur];
        const isCor = (idx === q.cor);
        if(isCor) score++;

        const modal = document.getElementById('modal');
        const mResult = document.getElementById('m-result');
        mResult.innerText = isCor ? "CORRECT!" : "WRONG!";
        mResult.style.color = isCor ? "var(--correct)" : "var(--wrong)";
        
        document.getElementById('m-exp').innerHTML = marked.parse(q.a[idx].exp || (isCor ? "정답입니다!" : "아쉽게도 틀렸습니다."));
        modal.style.display = "flex";
        Prism.highlightAll();
    }

    function next() {
        document.getElementById('modal').style.display = "none";
        cur++;
        if(cur < questions.length) render();
        else showFinal();
    }

    function showFinal() {
        document.getElementById('screen-quiz').classList.add('hidden');
        document.getElementById('screen-result').classList.remove('hidden');
        document.getElementById('final-score').innerText = score + " / " + questions.length;
        
        const ratio = score / questions.length;
        let msg = "더 공부하고 오세요!";
        if(ratio === 1) msg = "당신은 완벽한 마스터입니다!";
        else if(ratio >= 0.7) msg = "훌륭한 성적입니다!";
        document.getElementById('result-msg').innerText = msg;
    }
</script>
</body>
</html>
