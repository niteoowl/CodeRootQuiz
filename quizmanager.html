<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QUIZ MASTER - PRO MANAGER</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/npm/galmuri@latest/dist/galmuri.css');
        :root { --bg: #f8f9fa; --card: #ffffff; --text: #1a1a1b; --primary: #FB5424; --border: #000; --shadow: #bcbcbc; }
        [data-theme="dark"] { --bg: #121212; --card: #1e1e1e; --text: #e2e8f0; --border: #fff; --shadow: #000; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Galmuri9', sans-serif; }
        body { background-color: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 340px 1fr; gap: 25px; }
        header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 4px solid var(--border); padding-bottom: 10px; }
        .panel { background: var(--card); border: 4px solid var(--border); box-shadow: 6px 6px 0 var(--shadow); padding: 20px; height: calc(100vh - 140px); overflow-y: auto; }
        
        /* 리스트 스타일 */
        .quiz-item { padding: 15px; border: 2px solid var(--border); margin-bottom: 12px; background: var(--bg); transition: 0.2s; }
        .quiz-item:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--border); }
        .quiz-item strong { display: block; margin-bottom: 5px; font-size: 1rem; color: var(--primary); }
        .quiz-item-btns { display: flex; gap: 5px; margin-top: 10px; }

        .editor-header { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { padding: 8px 15px; border: 2px solid var(--border); cursor: pointer; background: #ddd; }
        .tab-btn.active { background: var(--primary); color: #fff; }
        
        .q-card { border: 3px solid var(--border); padding: 15px; margin-bottom: 20px; background: #fffaf9; }
        .option-box { display: grid; grid-template-columns: 30px 1fr; gap: 10px; margin-top: 10px; padding: 10px; border: 1px solid #ccc; background: var(--card); }
        
        input, textarea { width: 100%; padding: 8px; border: 2px solid var(--border); background: var(--bg); color: var(--text); }
        textarea { resize: vertical; }
        
        .btn { background: var(--primary); color: #fff; border: 3px solid var(--border); padding: 8px 15px; cursor: pointer; box-shadow: 3px 3px 0 var(--border); font-size: 0.9rem; }
        .btn:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 var(--border); }
        .btn-sm { padding: 4px 8px; font-size: 0.75rem; }
        .btn-blue { background: #3182ce; } .btn-red { background: #e53e3e; } .btn-green { background: #2f855a; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

<header>
    <h1 style="color:var(--primary)">PIXEL QUIZ MASTER PRO</h1>
    <div style="display:flex; gap:10px; align-items:center;">
        <span style="font-size:0.7rem;">PLAYER PATH:</span>
        <input type="text" id="player-path" value="quiz.html" style="width:100px; padding:2px 5px; font-size:0.7rem;">
        <button class="btn btn-sm" onclick="toggleTheme()">THEME</button>
    </div>
</header>

<div class="container">
    <!-- 좌측 리스트 -->
    <div class="panel">
        <h2 style="font-size:1.1rem; margin-bottom:15px; border-bottom:2px solid var(--border); padding-bottom:5px;">
            MY QUESTS 
            <button class="btn btn-sm btn-blue" style="float:right;" onclick="resetEditor()">NEW</button>
        </h2>
        <div id="quiz-list">불러오는 중...</div>
    </div>

    <!-- 우측 에디터 -->
    <div class="panel">
        <div class="editor-header">
            <button class="tab-btn active" id="btn-form" onclick="switchTab('form')">VISUAL FORM</button>
            <button class="tab-btn" id="btn-json" onclick="switchTab('json')">RAW JSON (EDIT/PASTE)</button>
        </div>

        <div id="view-form">
            <div style="margin-bottom:20px; background:var(--bg); padding:10px; border:2px solid var(--border);">
                <label style="font-size:0.8rem; font-weight:bold; color:var(--primary);">QUEST TITLE</label>
                <input type="text" id="edit-title" placeholder="퀴즈 전체 제목을 입력하세요">
            </div>
            <div id="q-container"></div>
            <button class="btn btn-blue" style="width:100%; margin-top:10px; height:50px;" onclick="addQuestionField()">+ ADD NEW QUESTION</button>
        </div>

        <div id="view-json" class="hidden">
            <div style="background:#fff3cd; padding:10px; border:2px solid #ffeeba; color:#856404; font-size:0.75rem; margin-bottom:10px;">
                💡 외부에서 작성한 JSON을 여기에 붙여넣으면 폼 에디터에 즉시 반영됩니다.
            </div>
            <textarea id="json-area" style="height:500px; font-family:monospace; font-size:0.85rem;" oninput="syncJSONToForm()"></textarea>
        </div>

        <div style="margin-top:30px; border-top:4px solid var(--border); padding-top:20px;">
            <button class="btn" style="width:100%; font-size:1.2rem; height:60px; background:var(--primary);" onclick="handleSave()">SAVE DATA TO CLOUD</button>
        </div>
        <input type="hidden" id="edit-id" value="">
    </div>
</div>

<script>
    const SB_URL = "https://eixxtdnkqopqiawqvibl.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVpeHh0ZG5rcW9wcWlhd3F2aWJsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3OTQ5MjYsImV4cCI6MjEwMjM3MDkyNn0.R7--WSmlJnYuz2bymCUhzzpTKVY-OHNIhyAR7e-qMYE";
    let db;

    window.addEventListener('DOMContentLoaded', () => {
        db = window.supabase.createClient(SB_URL, SB_KEY);
        loadList();
        addQuestionField();
    });

    async function loadList() {
        const { data } = await db.from('quizzes').select('*').order('created_at', { ascending: false });
        const list = document.getElementById('quiz-list');
        list.innerHTML = data.length === 0 ? "<p style='color:#888; font-size:0.8rem;'>생성된 퀴즈가 없습니다.</p>" : "";
        
        data.forEach(q => {
            const div = document.createElement('div');
            div.className = 'quiz-item';
            div.innerHTML = `
                <div onclick="loadToEditor('${q.id}')" style="cursor:pointer">
                    <strong>${q.title}</strong>
                    <small style="color:#666;">${q.quiz_data.length} Questions</small>
                </div>
                <div class="quiz-item-btns">
                    <button class="btn btn-sm btn-green" style="flex:1" onclick="copyQuizLink('${q.id}')">LINK COPY</button>
                    <button class="btn btn-sm btn-red" onclick="handleDelete('${q.id}')">DEL</button>
                </div>
            `;
            list.appendChild(div);
        });
    }

    // 링크 복사 함수
    function copyQuizLink(id) {
        const playerFileName = document.getElementById('player-path').value;
        const fullUrl = `${window.location.origin}${window.location.pathname.replace(/\/[^\/]*$/, '/')}${playerFileName}?id=${id}`;
        
        navigator.clipboard.writeText(fullUrl).then(() => {
            alert("공유 링크가 복사되었습니다!\n" + fullUrl);
        }).catch(err => {
            alert("링크 생성에 실패했습니다: " + err);
        });
    }

    function addQuestionField(data = null) {
        const container = document.getElementById('q-container');
        const qIdx = container.children.length;
        const card = document.createElement('div');
        card.className = 'q-card';
        const options = data ? data.a : [{text:'',exp:''},{text:'',exp:''},{text:'',exp:''},{text:'',exp:''}];
        
        let optHtml = '';
        options.forEach((opt, oIdx) => {
            optHtml += `<div class="option-box">
                <input type="radio" name="cor_${qIdx}" value="${oIdx}" ${data && data.cor == oIdx ? 'checked' : (oIdx==0?'checked':'')} onchange="updateJSON()">
                <div>
                    <input type="text" class="opt-text" placeholder="보기 내용" value="${opt.text}" oninput="updateJSON()">
                    <textarea class="opt-exp" placeholder="이 오답/정답 선택 시 출력할 개별 해설" oninput="updateJSON()">${opt.exp||''}</textarea>
                </div>
            </div>`;
        });

        card.innerHTML = `<div style="display:flex; gap:10px; margin-bottom:10px; align-items:center;">
            <span style="background:var(--border); color:var(--card); padding:2px 8px;">Q${qIdx+1}</span>
            <input type="text" class="q-val" placeholder="질문 내용을 입력하세요" value="${data?data.q:''}" oninput="updateJSON()" style="flex:1; font-weight:bold;">
            <button class="btn btn-red btn-sm" onclick="this.parentElement.parentElement.remove(); updateJSON();">X</button>
        </div><div>${optHtml}</div>`;
        container.appendChild(card);
        updateJSON();
    }

    function updateJSON() {
        const cards = document.querySelectorAll('.q-card');
        const quizData = [];
        cards.forEach((card, qIdx) => {
            const options = [];
            card.querySelectorAll('.option-box').forEach(box => {
                options.push({ text: box.querySelector('.opt-text').value, exp: box.querySelector('.opt-exp').value });
            });
            quizData.push({
                q: card.querySelector('.q-val').value,
                cor: parseInt(card.querySelector(`input[name="cor_${qIdx}"]:checked`).value),
                a: options
            });
        });
        document.getElementById('json-area').value = JSON.stringify(quizData, null, 2);
    }

    function syncJSONToForm() {
        try {
            const raw = document.getElementById('json-area').value;
            if(!raw.trim()) return;
            const data = JSON.parse(raw);
            const container = document.getElementById('q-container');
            container.innerHTML = "";
            data.forEach(q => addQuestionField(q));
        } catch(e) {}
    }

    async function handleSave() {
        updateJSON();
        const id = document.getElementById('edit-id').value;
        const title = document.getElementById('edit-title').value;
        const quiz_data = JSON.parse(document.getElementById('json-area').value);

        if(!title) return alert("제목을 입력하세요!");
        
        const payload = { title, quiz_data };
        const { error } = id ? await db.from('quizzes').update(payload).eq('id', id) : await db.from('quizzes').insert([payload]);
        
        if(error) alert("저장 실패: " + error.message);
        else { alert("데이터베이스 저장 성공!"); loadList(); }
    }

    async function loadToEditor(id) {
        const { data } = await db.from('quizzes').select('*').eq('id', id).single();
        document.getElementById('edit-id').value = data.id;
        document.getElementById('edit-title').value = data.title;
        document.getElementById('json-area').value = JSON.stringify(data.quiz_data, null, 2);
        syncJSONToForm();
    }

    function resetEditor() {
        document.getElementById('edit-id').value = "";
        document.getElementById('edit-title').value = "";
        document.getElementById('q-container').innerHTML = "";
        addQuestionField();
    }

    function switchTab(type) {
        document.getElementById('view-form').classList.toggle('hidden', type === 'json');
        document.getElementById('view-json').classList.toggle('hidden', type === 'form');
        document.getElementById('btn-form').classList.toggle('active', type === 'form');
        document.getElementById('btn-json').classList.toggle('active', type === 'json');
        if(type === 'json') updateJSON();
    }

    async function handleDelete(id) { if(confirm("정말 삭제하시겠습니까?")) { await db.from('quizzes').delete().eq('id', id); loadList(); } }
    function toggleTheme() { document.documentElement.setAttribute('data-theme', document.documentElement.getAttribute('data-theme')==='dark'?'light':'dark'); }
</script>
</body>
</html>
